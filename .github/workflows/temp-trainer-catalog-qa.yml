name: temp-trainer-catalog-qa
on:
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check app.js
          node --check personal-trainers.js
          node --check dashboard.js
      - name: Existing verification
        run: |
          node verify_personal_trainers.cjs
          node verify_trainer.cjs
          node verify_ai_tutor.cjs
          node verify_phase2a.cjs
          if [ -f verify_k1.cjs ]; then node verify_k1.cjs; fi
