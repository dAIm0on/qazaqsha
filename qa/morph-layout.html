<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qazaqsha · проверка размеров</title><style>body{margin:16px;background:#eee;font:16px sans-serif}iframe{display:block;background:white;border:1px solid #777;width:390px;height:844px;max-width:none}button{padding:12px;margin:0 8px 12px 0}p{max-width:700px}output{display:block;margin-bottom:12px}</style></head><body><h1>Проверка адаптивной вёрстки</h1><p>Размер области приложения: 390×844 или 1280×900 CSS-пикселей. Это проверка layout в iframe; физическая экранная клавиатура и жесты телефона здесь не эмулируются.</p><button id="mobile">390 × 844</button><button id="desktop">1280 × 900</button><button id="measure">Измерить ширину</button><output id="result">Загрузка</output><iframe id="app" title="Qazaqsha — проверяемая страница" src="../"></iframe><script>const f=document.getElementById('app'),o=document.getElementById('result');function measure(){const d=f.contentDocument;o.textContent='viewport '+f.contentWindow.innerWidth+'×'+f.contentWindow.innerHeight+'; clientWidth '+d.documentElement.clientWidth+'; scrollWidth '+d.documentElement.scrollWidth;}document.getElementById('mobile').onclick=()=>{f.style.width='390px';f.style.height='844px';requestAnimationFrame(measure);};document.getElementById('desktop').onclick=()=>{f.style.width='1280px';f.style.height='900px';requestAnimationFrame(measure);};document.getElementById('measure').onclick=measure;f.onload=measure;</script></body></html>
