<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Обновление тренажёра без потери прогресса</title>
  <style>
    body{font:18px/1.5 "Golos Text",system-ui,sans-serif;max-width:40rem;margin:2rem auto;padding:0 1.2rem;color:#161412;background:#F6F1E8}
    button{font:inherit;padding:.7rem 1rem;margin:.3rem .5rem .3rem 0;border-radius:12px;border:1px solid #161412;background:#161412;color:#FFFCF7;cursor:pointer}
    button.secondary{background:#FFFAF4;color:#161412}
    .ok{background:#E5EFDF;padding:12px 14px;border-radius:8px}
    .warn{background:#F5EACD;padding:12px 14px;border-radius:8px}
    code{background:#EDE4D8;padding:0 .25em}
  </style>
</head>
<body>
  <h1>Обновить без потери прогресса</h1>
  <p>Канонический адрес: <code>https://qazaqsha.pages.dev/</code>. Зеркало github.io может отставать.</p>
  <p class="warn">Сначала скачай копию прогресса из <strong>этого</strong> окна. Потом обновляй.</p>
  <p><button type="button" id="export">1. Скачать копию</button></p>
  <p id="export-status"></p>
  <p><button type="button" id="refresh">2. Обновить это окно, прогресс оставить</button></p>
  <p class="ok">Шаг 2 снимает только старые файлы сайта. Ответы в памяти браузера не удаляются.</p>
  <p><a href="./">3. Вернуться в тренажёр</a></p>
  <script>
    const KEY='qazaq-kris-course-v1';
    document.getElementById('export').onclick=()=>{
      const raw=localStorage.getItem(KEY);
      const status=document.getElementById('export-status');
      if(!raw){status.textContent='В этом окне прогресса нет. Открой эту страницу из окна, где ты уже занималась.';return;}
      const blob=new Blob([raw],{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='progress.json';a.click();
      status.textContent='Файл progress.json скачан. Его можно импортировать: Сегодня → Настройки и перенос данных.';
    };
    document.getElementById('refresh').onclick=async()=>{
      try{
        const keys=await caches.keys();
        await Promise.all(keys.filter(k=>k.startsWith('qazaq-offline-')).map(k=>caches.delete(k)));
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r=>r.unregister()));
      }catch{}
      location.reload();
    };
  </script>
</body>
</html>
